name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm ci
      - run: npm lint
      - run: npm typecheck
      - run: npm test
      - run: npm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm test:e2e
